apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: tc-pipeline-run-
spec:
  serviceAccountName: pipeline
  pipelineRef:
    name: juphc-tc-pipeline
  params:
    - name: repo-url
      value: "https://github.com/Shahzaib786c/tax-calculator.git"
    - name: branch
      value: "main"
    - name: build-image
      value: "us.icr.io/sn-labs-shahzaib8237/tax-calculator"
  workspaces:
    - name: pipeline-workspace
      persistentVolumeClaim:
        claimName: pipelinerun-pvc
    - name: dockerconfig-ws
      secret:
        secretName: docker-reg-creds
